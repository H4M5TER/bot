services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    ports:
    - 6099:6099
    - 3001:3001
    environment:
    - ACCOUNT=2993397759
    - WS_ENABLE=true
    - NAPCAT_UID=1000
    - NAPCAT_GID=1000
  lagrange:
    image: ghcr.io/lagrangedev/lagrange.onebot:edge
    container_name: lagrange
    restart: unless-stopped
    ports:
    - 5141:5141
    - 5142:5142
    volumes:
    - ./lagrange:/app/data
    environment:
    - UID=1000
    - GID=1000
    logging:
      driver: json-file
      options:
        max-size: 1m
  meme-generator:
    image: meetwq/meme-generator:0.0.21
    container_name: meme-generator
    restart: unless-stopped
    ports:
    - 23333:2233

networks:
  default:
    name: net0
    external: true
